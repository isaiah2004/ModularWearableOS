*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground,#24343c);font:14px/1.5 var(--font-sans,system-ui,sans-serif)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.box{padding:16px;border:1px solid var(--border,#ccd6db);border-radius:var(--radius,10px);background:var(--card,#f3f6f8)}.stat strong{font-size:26px;display:block;line-height:1.2}.stat span,.muted{color:var(--muted-foreground,#5c6c74);font-size:12px}p{margin:12px 0}nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}button,input,select{font:inherit;border:1px solid var(--border,#ccd6db);border-radius:7px;color:inherit;background:var(--card,#f3f6f8);padding:7px 9px}button{cursor:pointer}button.active{border-color:var(--accent,#247d72);color:var(--accent,#247d72)}.filters{display:flex;gap:8px;margin:12px 0}.filters input{flex:1;min-width:0}details{border-bottom:1px solid var(--border,#ccd6db);padding:10px 0}summary{cursor:pointer;overflow-wrap:anywhere}summary strong{font-weight:600}.id{font:11px var(--font-mono,monospace);color:var(--muted-foreground,#5c6c74);margin-right:6px}.badge{font-size:11px;border:1px solid currentColor;padding:1px 5px;border-radius:4px;display:inline-block;margin-right:5px}.P1{color:var(--foreground,#24343c);border-color:#c16b52}.P2{color:var(--foreground,#24343c);border-color:#a98a45}.P3{color:var(--muted-foreground,#5c6c74)}.box{margin:10px 0}.label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground,#5c6c74)}h3{font-size:14px;margin:6px 0}ul{padding-left:18px}li{margin:6px 0}.app{padding:9px 0;border-bottom:1px solid var(--border,#ccd6db)}.app b{display:block}.empty{color:var(--muted-foreground,#5c6c74);padding:20px 0}@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:24px}.filters{flex-wrap:wrap}.filters input{width:100%;min-width:100%}}@media(prefers-color-scheme:dark){html,body{color:var(--foreground,#e0e8ec)}.stat,.box,button,input,select{background:var(--card,#202b32);border-color:var(--border,#3b4850)}}
</style></head><body><div class="stats" id="stats"></div><p id="intro"></p><nav aria-label="Audit summary"></nav><div id="content"></div><p class="muted">Read-only swarm audit · 21 October 2026 · all inventoried source hashes unchanged. The complete report contains evidence, routines, tests, limits and logging/QoL gaps for every module and app.</p><script>
const D={"counts":{"findings":100,"modules":179,"apps":26,"screens":70,"inventoried_files":684,"handwritten_files":227,"handwritten_lines":65693,"compiled_sources":129,"by_severity":{"P1":10,"P2":76,"P3":14},"by_category":{"bug":53,"edge_case":21,"dev_qol":15,"performance":3,"logging":8}},"findings":[{"id":"APP-006","severity":"P1","title":"Recorder file naming can overwrite an existing recording","impact":"The path contains no year, monotonic sequence, or collision suffix. The HAL opens it with wb, truncating the existing recording before any new samples are captured.","recommendation":"Allocate a unique persistent filename with full UTC date and a collision suffix or sequence; create it exclusively and retry on existence. Retain the full recording timestamp as metadata for chronological sorting and today labels.","confidence":"code_proven"},{"id":"DEV-001","severity":"P1","title":"Leaving the timezone picker changes UTC by the timezone delta again","impact":"pick_commit changes the preference while the picker remains open. The host applies the new TZ before the exit; pick_leave then adds another 30 minutes and hal_set_datetime changes UTC by that amount. Larger selections can shift hours or dates; alarms, calendar/day grouping, journal epochs and filenames can become wrong. board_clock_changed queues this erroneous epoch for RTC persistence when the RTC write succeeds, so a reboot need not repair it. This is separate from world-clock display APP-013 and RTC write retry PLAT-010.","recommendation":"Keep UTC unchanged when selecting a display offset. Apply the offset once in the host; remove wall-clock mutation from picker exit and compute previews from a UTC anchor. Use calendar conversion instead of hand-written one-month rollover. Add firmware-like timezone/epoch invariance checks, including quarter-hour and date-boundary choices.","confidence":"observed"},{"id":"HEALTH-001","severity":"P1","title":"Unreadable latest workout bank can be overwritten by an older recovered checkpoint","impact":"Recovery silently rolls back to the older session/history, reports ready/available with zero errors, then may destroy the only newer checkpoint. The foreign-card hash guard cannot identify a bank that could not be read. This is the workout recorder analogue of STOR-001; it is a separate call chain and file format.","recommendation":"Keep absent, validated-corrupt and unreadable states distinct. Defer authoritative recovery and all destructive bank writes while any existing bank has an unresolved I/O error; retry reads and retain an error/slot/errno. Preserve recovery lineage until both banks can be assessed.","confidence":"code_proven"},{"id":"PLAT-001","severity":"P1","title":"HTTP cover reception can exceed its allocated image buffer","impact":"The handler can write beyond its 125000-byte PSRAM allocation; memory corruption is a correctness risk independently of who sends the request. The station web server exposes the handler after association. No device or network request was made during this audit.","recommendation":"Reject content_len values other than the required image size before allocation or reception; bound each receive by remaining image capacity and publish only a complete staged image.","confidence":"code_proven"},{"id":"PLAT-002","severity":"P1","title":"Firmware update routes lack the explicit setup-session gate","impact":"A valid application image can be installed without a watch-side update session or application-layer authorization. Image structural integrity and rollback are separate from authorizing an update. This source finding is preserved for the root reviewer; no update was attempted.","recommendation":"Require an explicit bounded update session initiated on the watch and an authorization check shared by every update entrypoint; qualify a signed-image policy if authenticated firmware is required.","confidence":"code_proven"},{"id":"STOR-001","severity":"P1","title":"A transient checkpoint read error can destroy the newest previously durable preferences","impact":"A failed save can turn an already durable latest setting into an older setting on reboot. The dirty RAM retry is retained, but cannot protect against a reset during the failure interval.","recommendation":"Return separate missing/corrupt/I/O statuses. Abort writes on ambiguous read failures. Publish a new checked generation through a staged file or otherwise preserve both existing valid generations until verification; retain SD lock/lease, fsync/readback and dirty retry.","confidence":"code_proven"},{"id":"STOR-002","severity":"P1","title":"Journal append fallback can truncate existing sports and sensor history","impact":"All prior records in that hourly/daily file are lost and status.available is reported true. Historical low-DMA errors motivate testing this path; they do not prove this exact truncate sequence occurred on the watch.","recommendation":"Create only on a confirmed ENOENT; preserve and retry on EIO/ENOMEM/EMFILE. Retain update-mode append at the validated tail and explicit torn-tail recovery; a plain a+b substitution would defeat seek-based recovery. Log operation, errno, path ID and retained queue count.","confidence":"code_proven"},{"id":"STOR-003","severity":"P1","title":"Recording auto-resume is silently suppressed by temporary checkpoint read failures","impact":"The loader permanently marks intent loaded, sets inactive/uncorrupted, and reports no pending work. The crash-resume guarantee is lost without a visible checkpoint error for that boot; an explicit user start or later healthy reboot can recover.","recommendation":"Keep the resume state unknown and retry with backoff after read/I/O errors; only settle inactive after confirmed absence or the newest proven inactive generation, with no unreadable slot that might be newer. Expose loading/unknown/corrupt/active states and log which slot/operation failed.","confidence":"code_proven"},{"id":"STOR-004","severity":"P1","title":"Failed upload publication can delete the original file","impact":"Both original and new data are deleted; an error response does not restore the original. This can affect recordings, preferences, textures, or any user path accepted by the transfer protocol.","recommendation":"Use an explicit backup/publication protocol supported by FATFS: preserve original until new file is durable and rename succeeds, recover interrupted transactions at mount, and require an opt-in replacement mode for critical settings/active recordings.","confidence":"code_proven"},{"id":"STOR-006","severity":"P1","title":"Historical prolonged runtime exhausted SD sector DMA allocation headroom","impact":"Settings checkpointing, sensor history and diagnostic persistence failed together. The first flash was blocked safely; resetting recovered storage, but the runtime condition has no durable fix.","recommendation":"Give SD a guaranteed bounded DMA staging resource using the installed SDK host capability or a dedicated owner; include internal-DMA headroom in admission for radio/TLS/display/recording work. Measure the failing allocation window, then run an unplugged long-session soak with settings, diagnostics and recording concurrently.","confidence":"observed"},{"id":"APP-001","severity":"P2","title":"A GPS gap over 500 metres permanently freezes the track anchor","impact":"Recording remains active, but every subsequent position is rejected and both saved route and accumulated distance omit the remaining journey until the user returns within 500 m of the old point.","recommendation":"Track the last observation and fix-gap age separately from the last stored point. On a plausible reacquisition after a gap, begin a new GPX segment/reanchor without counting the unobserved gap; preserve a bounded speed/quality outlier filter.","confidence":"observed"},{"id":"APP-002","severity":"P2","title":"Navigate removes the only Stop control after prolonged GPS loss","impact":"The track and GPS continue running, but the NOW page shows the sky without Stop. The user must regain GPS to stop/save through the UI; no other production caller of svc_track_stop exists.","recommendation":"Make recording state determine Stop availability independently of fix state. Keep a Stop/save action on the searching and module-absent pages and on reopening an active session.","confidence":"observed"},{"id":"APP-003","severity":"P2","title":"Old BACK/TRACK guidance regains live brightness after 30 seconds without GPS","impact":"The old location, arrow, and start distance continue to be used but their stale dimming fades back to the live appearance. BACK TO START can continue saying YOU ARE AT THE START based on the old fix without a current-fix warning.","recommendation":"Separate fix validity/age from the NOW-page retention timeout. Keep stale styling and a clear age/no-fix state on every navigation page, and gate arrival confirmation on a current qualified fix.","confidence":"observed"},{"id":"APP-004","severity":"P2","title":"A failed track save cannot be retried before starting discards the session","impact":"svc_track_stop turns active off before the write and later calls return -1. Navigate shows a short NO SD CARD summary and then offers Start, whose implementation discards the retained points. No pending-save/retry UI or durable session recovery exists.","recommendation":"Retain an explicit unsaved session after stop and allow retry/export until successful or explicitly discarded. Save via a worker with mount lease, shared lock, checked flush/fsync/close, and atomic publication; root's storage audit owns the common SD lifecycle findings.","confidence":"code_proven"},{"id":"APP-005","severity":"P2","title":"Recorder scans only the first 24 files before choosing displayed memos","impact":"Enumeration stops at 24 before sorting. With the usual creation/name order, newer recordings are absent from the app even after reopening, while save confirmation still succeeds. A directory with 25 fixture memos reproduced omission of the newest file.","recommendation":"Scan the full directory and retain the newest 24 using a bounded selection structure, or provide pagination. Show the total/count limit and an export/delete route so saved files remain discoverable.","confidence":"observed"},{"id":"APP-007","severity":"P2","title":"Recorder confirms SAVED before finalization and cannot distinguish disk failure","impact":"hal_rec_stop only requests an asynchronous stop, but the app clears s_rec_open, reloads/stats the still-open file, and immediately announces SAVED/success. Final buffered samples, WAV length header, and fclose may not be complete; real disk errors follow the same success path. Displayed duration can be derived from an incomplete file.","recommendation":"Expose recorder states RECORDING, FINALIZING, SAVED, and ERROR with a completion result and written/dropped sample counts. Add the file to the list and confirm only after checked finalization; surface recoverable/truncated recordings accurately.","confidence":"observed"},{"id":"APP-008","severity":"P2","title":"A covering screen stops compass calibration without resuming it","impact":"leave always finishes/stops HAL calibration, but reveal enter returns early and keeps M_CAL. With no previous valid calibration, progress stays at zero and the figure-eight UI cannot complete. With an old calibration, the preserved UI may instead accept the old completed status as the new attempt's result.","recommendation":"Preserve an in-progress calibration on a cover, or deliberately cancel it and move to a resumable prompt. Reconcile HAL calibration state on reveal and distinguish cancelled/failed/successful completion.","confidence":"observed"},{"id":"APP-009","severity":"P2","title":"Compass Level claims FLAT when the IMU is unavailable","impact":"A failed hal_imu_read leaves the default acceleration (0,0,1), producing a centered bubble, zero tilt, and FLAT despite no measurement. The optional-sensor contract is not reflected in this internal screen.","recommendation":"Track IMU validity and render a sensor unavailable/stale state. Only show tilt or FLAT after a qualified sample; retain the magnetometer's separate availability state.","confidence":"code_proven"},{"id":"APP-010","severity":"P2","title":"Cellular reports SENT when an SMS was merely queued","impact":"The reader immediately shows SENT and success feedback, then closes after 1.3 s. Actual modem completion can take up to 60 s and may fail; there is no app completion/error path for that request.","recommendation":"Return a send request ID and expose queued/sending/sent/failed status. Keep the result pending until modem acceptance, and permit retry on the actual failure without falsely confirming delivery.","confidence":"observed"},{"id":"APP-011","severity":"P2","title":"Read SMS messages become unread again on the next inbox poll","impact":"The app and HAL clear unread only in RAM. The mode-1 CMGL command deliberately preserves SIM read state, and no CMGR or other read-state operation is sent, so the next refresh restores REC UNREAD and its badge.","recommendation":"Keep the SIM's stable message index and issue the supported modem read-state update, or persist a local read overlay keyed to a stable message identity. Reconcile that overlay on every refresh.","confidence":"code_proven"},{"id":"APP-012","severity":"P2","title":"An inbox refresh can make opening one SMS mark another SMS read","impact":"The app's displayed message remains from the old s_sms array, but mark_read(s_open) applies the old row index to the new driver order. The wrong message and unread count are changed.","recommendation":"Include stable modem message IDs and snapshot generation in hal_sms. Resolve read/update operations by ID rather than by a transient row position, and refresh inbox counts as its generation changes.","confidence":"code_proven"},{"id":"APP-013","severity":"P2","title":"World Clock infers the wrong day and relative offset in overlapping extreme timezones","impact":"Time-of-day subtraction infers UTC-11 instead of UTC+13. London displays the correct clock hour modulo 24 but the wrong weekday/day relationship and a relative offset differing by 24 h. Similar ambiguity exists for overlapping positive/negative offset ranges.","recommendation":"Use the authoritative configured/effective timezone offset or calculate local-civil-epoch minus UTC using the full date. Add tests around UTC-12, UTC+12/+13/+14 and date-line rollover.","confidence":"observed"},{"id":"APP-014","severity":"P2","title":"Weather retains invalidated and indefinitely stale data as current","impact":"NOS ignores HAL stale/age metadata. If HAL later invalidates its cache on a city change, wx_from_hal simply returns and preserves the prior valid feed. App/widget treat any valid bit as WS_OK and show old weather with no age/source warning.","recommendation":"Propagate source, observed age, fetching/error status, and location generation through svc_weather_t. Invalidate on explicit location change, keep stale content visibly dated, and never label old-city data as a successful new-city feed.","confidence":"observed"},{"id":"APP-015","severity":"P2","title":"Weather forecast values are relabelled with the watch's current hours and days","impact":"HAL forecast entries carry UTC timestamps and the location's UTC offset, but the service drops them. The app labels unchanged cached values using current watch hour+1 and weekday+i; an old/yesterday or other-location entry is presented as a new future hour/TODAY.","recommendation":"Preserve entry epochs and the forecast location timezone. Select entries against the current trusted epoch, render their actual local times/dates, and drop expired entries rather than moving their labels.","confidence":"code_proven"},{"id":"APP-016","severity":"P2","title":"An ended alert covered by another alert can remain orphaned in the screen stack","impact":"ring_screen clears pushed merely because the alert is not on top. It does not remove the covered stack entry. Later it no longer owns cleanup; alarm/timer reveal initialization does not reject their ended service state, so a stale alert remains visible/awake and may require explicit user dismissal. Find Watch has a similar was_active-on-reveal limitation.","recommendation":"Retain alert ownership while covered and reconcile/remove ended entries on reveal, or give every ring screen a service generation plus an ended-state close path. Verify simultaneous and nested alarms, timers, calls, and Find Watch transitions.","confidence":"observed"},{"id":"APP-017","severity":"P2","title":"Music air gestures are not delivered from hardware and stop being requested","impact":"Music enables the gesture engine once and handles IN_AIR, but production code never drains hal_light_gesture into nos_air. The only hardware drain is the Modules diagnostic. The gesture driver also disables the engine after eight idle seconds because Music never refreshes/drains it. Simulator air injection can conceal the missing device path.","recommendation":"Have one active-consumer-aware hardware input pump drain APDS gestures into nos_air, refreshing demand only where gestures are used. Release demand on leave and test the production HAL path beyond eight seconds.","confidence":"code_proven"},{"id":"APP-021","severity":"P2","title":"Phone alarm synchronization can silently overwrite a different alarm being edited","impact":"The editor retains only the numeric index and its old drum values. If the new table still has that index, ed_valid passes; the next edit tick writes the old wheel time into the replacement alarm and leaving persists it. No generation/identity check detects the replacement.","recommendation":"Give alarm tables a generation and alarms stable identities. On remote replacement, rebind/reload the editor or close it with a visible update message; never apply a stale draft to a new alarm solely because its row number matches.","confidence":"code_proven"},{"id":"APP-022","severity":"P2","title":"The LTE radio loses its lease while the SMS inbox or reader is still open","impact":"The driver's request expires and it powers the modem off even though the user is actively using a Cellular screen. New messages/registration updates stop until returning to the status screen or another action wakes the modem; app inbox contents and enabled preference do not reveal that power transition.","recommendation":"Keep an explicit LTE lease while any foreground Cellular status/inbox/reader screen requires live connectivity, and release it on leave. Show actual radio state if cached-only/offline browsing is intentional.","confidence":"code_proven"},{"id":"DEV-002","severity":"P2","title":"Settings GPS auto changes a preference with no device-side consumer","impact":"The Settings row and Control Center display the same bit, but only the tile calls hal_gps_enable. No active ESP firmware consumer applies gps_auto on boot or preference change; its other reader is inside the simulator-only Sports path. The row cannot reliably start/stop the configured GPS demand and the persisted display can disagree with the radio demand. This does not imply GPS getters stop requesting their own leases.","recommendation":"Define auto versus explicit GPS demand and apply the preference through one shared routine from both controls and boot. Expose actual demand, lease owner and powered state separately in Modules.","confidence":"code_proven"},{"id":"DEV-003","severity":"P2","title":"Wrist selection and learned wake position use independent wrist values","impact":"Settings changes nos_prefs.wrist_left, while wake_service chooses and learns s_cfg.view[s_cfg.wrist]. That independent stored wrist defaults left and current NOS never calls wake_service_set(\"wrist\",...). A right-wrist selection therefore does not select the right wake pose; learning overwrites the currently selected wake_cfg hand. A legacy UI has the setter but is not in the active NOS build.","recommendation":"Unify the wrist authority or explicitly migrate/synchronize the wake wrist when Settings changes. Translate left/right enum meanings carefully. Preserve the two learned poses and expose which one is active in the learning result.","confidence":"code_proven"},{"id":"DEV-004","severity":"P2","title":"Covering the Wi-Fi keyboard erases an unfinished password","impact":"nos_push invokes the covered screen leave callback. keyboard_leave unconditionally clears N.pass, and the keyboard has no enter callback to restore a draft. The same password field is revealed empty and connection attempts can fail after an unrelated interruption.","recommendation":"Preserve the in-memory draft on a temporary cover; scrub it when the user actually leaves, connects or cancels. Add a cover/reveal test with no secret text in logs.","confidence":"observed"},{"id":"DEV-005","severity":"P2","title":"Modules Motion detail displays numbers even after the IMU read fails","impact":"The Modules list correctly reports no reply through V.imu_ok, but Motion detail treats all non-extension board modules as present and formats V.imu without checking imu_ok. It can show zero tilt or retained vectors and an apparently live level for unavailable data.","recommendation":"Gate the Motion detail and bubble on the same freshness/validity decision as the list; show unavailable or last-good age and retain an explicit retry state.","confidence":"code_proven"},{"id":"DEV-006","severity":"P2","title":"Diagnostics mistakes legitimate constant light readings for a frozen sensor","impact":"Each UI poll is counted as a read and equality of extrema is treated as proof of a stopped stream. A steady functioning sensor fails READING FROZEN. No sample sequence or age establishes acquisition liveness; the UI does not request a stimulus before that automatic verdict. Similar equality-based mic/mag checks warrant explicit stimulus semantics.","recommendation":"Use sample timestamps or acquisition sequence numbers for liveness. If response-to-motion/light is tested, prompt for a controlled change and distinguish inconclusive from failed.","confidence":"observed"},{"id":"DEV-007","severity":"P2","title":"Simulator store replacement frees the old value before a fallible allocation","impact":"hal_store_save_checked returns failure after destroying the prior RAM value; size remains the prior positive value and hal_store_load can memcpy from NULL. Simulator failure behavior violates the checked-store contract and cannot validate that a failed preference save preserves the last good state. Interactive file persistence also uses direct wb replacement rather than the real SD checkpoints.","recommendation":"Allocate a replacement first, commit only after success, and leave old state intact on failure. Provide a firmware-compatible checkpoint fixture or clearly separate generic simulator storage from durability tests.","confidence":"observed"},{"id":"DEV-008","severity":"P2","title":"Default simulator builds can succeed with old code after a source compile failure","impact":"The build deliberately links the last good object, prints a warning, and can exit successfully. The resulting executable mixes source revisions but has no per-object provenance/degraded marker for downstream test/capture tools. A named -Out binary still shares the same object cache. This is an intentional interactive convenience with an insufficient verification boundary.","recommendation":"Make verification/package/test profiles require -Strict and carry a source/flags/compiler/object manifest. Keep an explicit interactive fallback switch with a visible degraded label that capture/report tools reject.","confidence":"code_proven"},{"id":"DEV-009","severity":"P2","title":"Simulator -Verify compares against stale HEAD and does not gate native command failures","impact":"The reference is git HEAD, which predates recovered rendering changes, rather than the same current source with hooks disabled. GCC, git show, executables and final --accuracy have no explicit exit-code gates in the Verify block; existing equal a.bin/b.bin can survive a failed run and produce a misleading pass. Fixed nos_cost_verify and shared object caches also permit interference between runs.","recommendation":"Compare the same snapshotted current sources compiled with/without hooks; use a GUID temp directory, remove/avoid preexisting outputs, require successful exit codes and exact output sizes, and carry both source hashes into the verification report.","confidence":"code_proven"},{"id":"DEV-010","severity":"P2","title":"Packaged flashing bypasses the preference checkpoint used by the supported updater","impact":"The package correctly uses separate segments and warns against flashing the merged image over NVS, but flash-package.ps1 immediately resets/writes through esptool. It never sends prefs flush or requires stored=1/match=1, so recent authoritative SD preferences can be lost across reboot. It also lacks the checked range validation used by flash_watch. NVS preservation alone does not establish SD preference durability.","recommendation":"Package a common checked flasher with segment manifest validation and explicit SD checkpoint acknowledgment. Preserve the existing merged-image warning; do not substitute another checkout. Keep C143 legacy variant flashing documented separately because it uses a different runtime.","confidence":"code_proven"},{"id":"DEV-011","severity":"P2","title":"Release packages omit the source identity and symbols needed to reproduce a device report","impact":"The package records binary hashes and honest hardware-evidence matches, but omits watchfw.elf/map, sdkconfig/dependency lock, current source manifest/archive and compiler identity. About only shows hardcoded1.0.0 plus compile date; serial info can report the ELF hash but the matching ELF is not bundled. Thus a copied image cannot independently reconstruct the changed source or symbolicate a later panic. There is no package-level feature/size-headroom gate tied to the recovered source. Root supplied an existing app headroom measurement of89888B; this report does not claim a fresh build.","recommendation":"Create one immutable build bundle containing ELF/map/bin/partition/config/lock/tool versions and a hash manifest of the actual dirty+untracked sources. Emit its short ID in About and trace boot metadata. Add required Solar/Orrery/Developer/home pager/sports feature checks and app-slot headroom reporting from existing build artifacts before packaging.","confidence":"code_proven"},{"id":"DEV-012","severity":"P2","title":"Current setup docs still direct users to stale-HEAD firmware and the dormant simulator","impact":"NOS.md describes a build/build_lead.ps1 route that builds committed HEAD in A:/makerspace/nos-lead and flashes it, directly conflicting with the authoritative dirty-workspace recovery instructions. README defaults to sim/build.ps1, which compiles core/apps and sim.exe rather than the current NOS simulator. Developers can validate or flash the wrong UI/source state despite following project documentation.","recommendation":"Make one active quick start point to tools/build.ps1 and sim/nos_build.ps1 -Strict, with dirty-source manifest and checked flashing. Mark old core/apps simulation and historical clean-HEAD instructions as archived. Crosslink the authoritative recovery/settings contract. PLAT-019 owns broader stale hardware/storage prose.","confidence":"code_proven"},{"id":"DEV-013","severity":"P2","title":"Regression entry points do not define one complete current-runtime gate","impact":"The aggregate calls optimizations and legacy/core suites, but does not call test_workouts.ps1 or test_sim_script_io.py. Optimization discovery is limited to test_nos_*.py plus selected named files; newer test_watchctl/test_sdsync/test_imu_audit/test_watch_power_analysis and workout export tests require separate profiles. test_launcher.ps1 validates the dormant core launcher baseline while current NOS has different launcher tests. No checked-in CI workflow was found. A green partial gate therefore leaves concrete independently runnable suites uncovered. Canonical TEST-001 separately owns the currently broken SD lease fixture that blocks the aggregate.","recommendation":"Publish a machine-readable test matrix for active NOS, Sports/recorder/storage, host tools, pixel/model and optional hardware jobs; have one strict aggregate invoke all required offline groups and summarize skips. Use isolated GUID outputs, pin tool versions, gate source/fixture manifests and run that same profile in CI. Keep legacy coverage clearly labeled.","confidence":"code_proven"},{"id":"DEV-015","severity":"P2","title":"Set time claims success when the unset calendar makes the HAL reject the update","impact":"board_restore_clock explicitly sets epoch0, yielding year1970. The UI preserves that date and edits only hour/minute. Firmware hal_set_datetime rejects years outside2000..2099, but its void API gives no result and the UI unconditionally shows TIME SET/success and exits. The time remains unset, leaving alarms/day grouping unreliable until an external full-date sync. The missing date entry is a feature limitation; the false success is a reachable bug.","recommendation":"Return a checked clock-set result; show failure/DATE NOT SET and keep the editor open when the calendar is invalid. Provide a full-date setup or clearly direct users to phone/Wi-Fi setup. Extend simulation to enforce the firmware validator.","confidence":"observed"},{"id":"ENG-001","severity":"P2","title":"Incoming notifications can change the target of an active swipe dismissal","impact":"The incoming notification is removed while the originally swiped notification remains. For phone-origin notifications the service can send DISMISS for the wrong ID.","recommendation":"Capture a stable ID when a press/swipe begins; resolve that ID immediately before any action. Freeze or cancel the visual owner if it disappears. Rebase geometry on every store revision, including updates/full-capacity replacements where count is unchanged.","confidence":"observed"},{"id":"ENG-002","severity":"P2","title":"Unbounded float animation time drifts and eventually stops advancing at ordinary cadence","impact":"Animations/deadlines drift well before the final freeze. At the freeze, frame count and nos_dt still advance but nos_t-based tweens, long press, toast/banner timeouts and power-sheet deadlines can stop completing. Wall uptime to encounter this depends on active/AOD/sleep frame cadence;524288 seconds is a clock value, not a claimed six-day wall-clock soak.","recommendation":"Represent monotonic animation deadlines with an integer64-bit clock and convert bounded relative intervals to float, or otherwise establish a consistent precision-preserving timestamp API. Merely changing the accumulator to double while leaving every app t0 as float does not solve relative-time precision.","confidence":"observed"},{"id":"ENG-003","severity":"P2","title":"Measured Apps and Settings scrolling still fail the 30 FPS hard floor","impact":"The saved target benchmark reports Apps p95=38ms,p99=44ms and Settings p95=42ms,p99=44ms; both exceed a33.33ms frame floor. The audit did not repeat target measurements and does not assign the entire overrun to blur alone.","recommendation":"Profile these exact windows on the target using tick, record, CPU raster, stripe wait, history and native blend areas. Optimize or bound the dominant measured owner; retain pixel-reference controls and report quality/approximation separately from frame-floor attainment.","confidence":"observed"},{"id":"FACE-001","severity":"P2","title":"MATRIX keeps the old 12/24-hour pattern until the next minute","impact":"The hour continues to display 13 instead of 1 until minute/hour changes. Stale wake handling only copies the cached old pattern and does not rebuild for this preference.","recommendation":"Include hour24 or formatted HH/MM in the pattern key and rebuild both current/previous patterns when format changes.","confidence":"observed"},{"id":"FACE-002","severity":"P2","title":"SPLIT temperature ignores the Imperial unit preference","impact":"TMP continues showing rounded Celsius with only a degree sign, while Weather shows Fahrenheit. Example 20 C remains20 instead of68, with no unit cue.","recommendation":"Use the same temperature conversion/rounding helper as Weather and include a C/F cue where practical.","confidence":"code_proven"},{"id":"FACE-003","severity":"P2","title":"SEGMENT replaces a valid zero active-minute total with a step estimate","impact":"The MIN value/ring invents steps/110 minutes although the service reports zero. In the focused test1100 steps/0 minutes becomes10 minutes; Activity uses the service total.","recommendation":"Use the authoritative active_min unconditionally, or add a separate explicit validity flag if estimated mode is needed.","confidence":"observed"},{"id":"FACE-004","severity":"P2","title":"Several watch faces lose their basic clock when face/font allocation is denied","impact":"MATRIX returns no drawing commands; Orrery returns before drawing its clock; SEGMENT draws rings/data but draw_time returns without time. The shell still draws its own overlays, so this is loss of the face clock rather than a claimed whole-panel hang.","recommendation":"Render a small allocation-free clock and an optional availability cue until required state/fonts are ready; keep the existing retry and ownership behavior.","confidence":"code_proven"},{"id":"FACE-005","severity":"P2","title":"A failed card photo load never retries after the SD asset becomes available","impact":"Failure adopts the returned buffers, advances stage and eventually removes LOADING. PHOTO renders a tinted fallback indefinitely until body reset/reopen, with no failure cue or retry.","recommendation":"Track failed stages distinctly, show PHOTO UNAVAILABLE/fallback state and retry on explicit action or bounded SD-ready recovery without violating page ownership.","confidence":"observed"},{"id":"FACE-006","severity":"P2","title":"Kepler solvers return incorrect positions for bundled high-eccentricity bodies","impact":"The8-step Newton solve can diverge and still feed sin/cos and visible positions. Actual source returns E=-1963363234.2687581 with residual1963363235.2327611rad; public and cached radius68.681648957AU differs from monotone-bisection solution28.512007850AU. Reduced residual0.1747377508rad and3D position separation40.455233130AU exclude an equivalent extra-revolution alias. A separate actual-face probe of its3-iteration belt solve at2026-10-21 (JD2461334.5), index3020/e≈0.993, differs by9.025477 projected pixels in BEYOND from a bracketed solve using the same basis. These are numerical failures, independent of external ephemeris accuracy;9px is a host source result, not a device measurement.","recommendation":"Use convergent safeguarded solvers or validate residual and fall back for both double conics and the separate float belt path; add actual high-e catalog cases across supported dates and exact/preview parity with an independent solution.","confidence":"observed"},{"id":"FACE-007","severity":"P2","title":"Opening Events freezes a partially completed astronomy scan and row list","impact":"The list stays incomplete for the entire visit. No scan owner runs behind the top Events screen and its rows only build at enter. Returning HOME resumes the scan; reopening is required to see new results.","recommendation":"Give scanning a service/Events owner with bounded slices, publish a stable generation and rebuild rows when complete/progress changes; expose progress so early results are understandable.","confidence":"observed"},{"id":"FACE-009","severity":"P2","title":"Orrery time travel silently exceeds its declared ephemeris validity interval","impact":"Planet/event/card calculations keep presenting ordinary precise-looking results outside the Table1 interval declared by ephem.h. This audit does not quantify the error outside that interval.","recommendation":"Clamp to a documented supported range or visibly label extrapolation and stop accuracy-sensitive event/card claims outside it.","confidence":"code_proven"},{"id":"FACE-012","severity":"P2","title":"SEGMENT cold entry synchronously completes work that background preparation normally slices","impact":"A single UI tick can finish all remaining scaled glyphs, allocate/initialize4 quadrant sprites, compute per-row ring spans and raster all180 empty segments before rendering. This stacks unbounded cold work on an interactive frame; current board deadline impact was not measured.","recommendation":"Retain bounded preparation on visible cold entry and draw a basic clock/ring fallback while it completes; qualify cold entry separately from warmed steady-state.","confidence":"strong_inference"},{"id":"HEALTH-002","severity":"P2","title":"Heart live display treats a cached reading as fresh and can retain invalidated values as current","impact":"One old acquisition can satisfy two seconds of contact and lock a current-looking BPM. Once locked, zero/unavailable BPM and SpO2 do not clear the displayed values while contact remains true. Leaving records the retained BPM with the current wall-clock time.","recommendation":"Track acquisition timestamps and age independently from attachment/contact. Count lock duration only across fresh acceptable samples; distinguish last reading from live value and clear or label invalid BPM and SpO2. Record the actual accepted acquisition time.","confidence":"code_proven"},{"id":"HEALTH-003","severity":"P2","title":"Breathe averages repeated cached HR values without age or acquisition checks","impact":"The summary average can be based entirely on an old reading and is weighted by render-frame polling frequency rather than accepted acquisition time. It is then recorded as a new current reading.","recommendation":"Accept only new, in-session, age-bounded acquisitions; accumulate a declared time-weighted average with valid coverage and show unavailable when coverage is insufficient. Preserve sample-time provenance when recording the result.","confidence":"code_proven"},{"id":"HEALTH-004","severity":"P2","title":"Heart history fabricates acquisition times from the current clock","impact":"The latest nonzero reading repeatedly becomes new again; the Home widget can report JUST NOW indefinitely for an unchanged old sample. Chart/day/minimum assumptions also cannot reliably reflect actual 10-minute acquisition times or gaps.","recommendation":"Return sample timestamps or a timestamped history generation from HAL. Update last-reading time only when an acquisition arrives; bin actual timestamps and explicitly represent gaps and reboot retention boundaries.","confidence":"code_proven"},{"id":"HEALTH-005","severity":"P2","title":"Closing Heart or Breathe can disable HR still requested by a background workout","impact":"The strap service can stop the sensor and reset its DSP on restart even though the workout still needs it, creating avoidable HR coverage/reacquisition gaps. The exact interruption duration depends on task timing; it was not measured on hardware.","recommendation":"Use per-consumer leases for workout, Heart, Breathe and background HR. Releasing one lease should not stop a sensor needed by another; log transitions with active owner bits and reason.","confidence":"strong_inference"},{"id":"HEALTH-006","severity":"P2","title":"Energy-family screens reset context on uncover and Quick Report emits an extra mark","impact":"Date, zoom, selection and unsaved editor/report choices are discarded. Quick Report also writes another unlabelled time mark on each uncover, so one visit can create unintended duplicate markers.","recommendation":"Honor reveal semantics and retain per-screen editing/timeline state. Separate first-open actions from uncover callbacks, and emit an automatic time mark only for an explicit new report session.","confidence":"code_proven"},{"id":"HEALTH-007","severity":"P2","title":"Wrist Tuning reports defaults restored even when the checked save failed","impact":"The UI announces DEFAULT THRESHOLDS RESTORED although tuning_adjust returns failure before installing the default configuration; active thresholds remain unchanged.","recommendation":"Branch on the checked return value as the sensitivity controls already do; retain a retryable failure message and display the active configuration revision.","confidence":"code_proven"},{"id":"HEALTH-008","severity":"P2","title":"Activity DAILY AVG excludes every zero-step day and the displayed current day","impact":"The value labelled THIS WEEK / DAILY AVG is an average of positive previous-day totals only. A single12000-step prior day plus five genuine zero days reports12000 rather than a six-day2000 average; today can show activity while the average remains empty/zero.","recommendation":"Define and label the intended rolling or calendar window. Track missing-day validity separately from genuine zero and use all valid days in the denominator; explicitly decide whether today participates.","confidence":"code_proven"},{"id":"HEALTH-009","severity":"P2","title":"Activity history clears its dirty flag after an unchecked failed save","impact":"Hourly bins, prior-day totals or active minutes can be lost, and the failed state is no longer scheduled for retry. This caller-level issue is distinct from the storage implementation failures STOR-001..003.","recommendation":"Use the checked result, keep dirty state on failure and retry with bounded backoff. Log key, day, error and last successful checkpoint time, separating persisted and RAM activity status.","confidence":"code_proven"},{"id":"HEALTH-010","severity":"P2","title":"One workout writer allocation or task-creation failure disables Sports storage until reboot","impact":"initialized is already true and io remainsNULL, so future init/tick/storage calls never retry. storage.ready staysfalse, preventing new workouts for the remainder of the boot even if memory later becomes available.","recommendation":"Expose a distinct worker-initialization error, retain retryable state and retry allocation/task creation at bounded intervals or on an explicit action. Do not start a workout until durable storage is ready.","confidence":"code_proven"},{"id":"HEALTH-011","severity":"P2","title":"Empty workout history hides loading, unavailable and corrupt-card states","impact":"The UI says No sessions yet / Finish a Sports session even when it has not established that history is empty. The storage layer preserves corrupt banks and exposes ready/corrupt/available, but that distinction is lost on this page.","recommendation":"Use storage status for loading/unavailable/corrupt/original-card-required states; show empty history only after a successful authoritative load. Offer retry and a concise diagnostic reason.","confidence":"code_proven"},{"id":"HOST-001","severity":"P2","title":"Host tools lack one consistent command/reply and rejected-input recovery contract","impact":"Different tools retry, stop or wait for different timeouts; a successful navigation can appear failed, an explicit rejected SD command can wait 60s, and operators need bespoke guard/resynchronization code.","recommendation":"Create one tested transport library with capability negotiation, command IDs, explicit dispatch/result ACKs and per-command idempotence metadata; centralize guarded read-only retries and preserve no-blind-retry behavior for recording/reset/delete actions. Export raw wire diagnostics with redaction.","confidence":"observed"},{"id":"OBS-001","severity":"P2","title":"Persistent crash records do not preserve the faulting instruction, task or backtrace","impact":"The next boot identifies a crash and replays recent actions, but cannot attribute the actual exception or stack to an app/worker. This limits diagnosis of the reported recording and Battery History crashes.","recommendation":"Add a bounded crash artifact containing build ID, reset cause, exception PC/address, core/task, SP and a supported backtrace/core-dump format. Reserve retention separately from ordinary journal rotation and export symbolized reports using the matching ELF.","confidence":"code_proven"},{"id":"OBS-002","severity":"P2","title":"Allocation diagnostics lack timestamps and allocating callsite context","impact":"NOSALLOC retains only the latest size/caps/function label and counters. Function heap_caps_malloc identifies the allocator rather than the requesting subsystem, so later free-memory reports cannot explain the failure.","recommendation":"Use a small allocation-failure ring in internal/RTC memory with monotonic timestamp, core/task ID, bounded return address/callsite token, caps and nearby free/largest metrics captured only when safe. Persist/translate outside the hook; track resource owner high-water marks.","confidence":"observed"},{"id":"OBS-003","severity":"P2","title":"Diagnostic evidence shares the failing SD resource and can overflow before recovery","impact":"The 128-record diagnostic queue fills and drops new records; a 32-entry RTC ring retains only a recent suffix. Action/power history around a prolonged incident can disappear, just when it is needed most.","recommendation":"Prioritize fault/power/recording-transition events over routine events, reserve an emergency bounded channel independent of SD, record first/last/count summaries for repeated failures, and expose a sticky evidence-loss indication with an export bundle.","confidence":"observed"},{"id":"PLAT-003","severity":"P2","title":"Concurrent getter renewal can immediately expire an external sensor lease","impact":"Unsigned now-last_get becomes nearly UINT32_MAX and passes the 8-second idle test. GPS, LTE, or HR can stop while a visible app or workout is renewing them; subsequent enables may restart them. A slow preceding service widens the timing window.","recommendation":"Use a wrap-safe signed elapsed comparison that treats a renewal newer than the captured time as fresh; synchronize lease state and refresh the service timestamp around potentially slow work.","confidence":"code_proven"},{"id":"PLAT-004","severity":"P2","title":"Heart-rate background sampling has no effective timeout when FIFO acquisition fails","impact":"The advertised 40-second background limit is checked only after a successful nonempty FIFO read. The LED stream can remain requested indefinitely; pointer failures call stop but leave bg set, causing another start. Old cached readings can also remain visible to callers that do not inspect sample_ms. Workout metrics explicitly check the 3-second freshness limit, reducing that consumer impact.","recommendation":"Apply the background deadline before any acquisition early return, cap restart attempts, clear acquisition state on persistent errors, and invalidate stale cached outputs consistently.","confidence":"code_proven"},{"id":"PLAT-005","severity":"P2","title":"Environment cache remains valid through repeated conversion-trigger failures","impact":"The old pressure, temperature and humidity remain valid indefinitely. Weather/altimeter UI and logs can present frozen measurements as current; no acquisition timestamp is in hal_env.","recommendation":"Track last successful acquisition and invalidate by age across trigger, readiness and data-read failure paths; expose the last operation/error and retry count.","confidence":"code_proven"},{"id":"PLAT-006","severity":"P2","title":"Light cache can remain valid when measurement-channel reads cease succeeding","impact":"The error counter resets after the status read, then the previous valid lux is republished. Automatic brightness can remain based on a frozen reading indefinitely. Proximity has the same missing acquisition-age distinction.","recommendation":"Track ALS/proximity success timestamps and channel errors independently, expire old channels, and expose stale/invalid state to automatic brightness.","confidence":"code_proven"},{"id":"PLAT-007","severity":"P2","title":"Power-off does not coordinate shutdown of optional strap devices","impact":"The ESP enters deep sleep after stopping the board task and onboard IMU, but external device shutdown commands and file-close services have no completion barrier. VBAT-powered strap devices can continue consuming power after the UI says power off. Exact residual current depends on attached hardware and GPIO behavior and was not measured. Audio file ownership is also being reviewed independently by root.","recommendation":"Add an asynchronous platform shutdown coordinator: reject new work, stop each external stream, wait for owned files and hardware acknowledgments with bounded failure reporting, then unmount and sleep.","confidence":"strong_inference"},{"id":"PLAT-008","severity":"P2","title":"A transient touch I2C failure becomes an input release","impact":"The read returns the same value as no touch. touch_poll enqueues an up event and a later successful read starts another down event, splitting a drag or completing a tap while the finger is still on the panel. Device evidence contains I2C errors, but it does not prove which gestures were affected.","recommendation":"Make touch acquisition tri-state (valid down/up, invalid read), retain contact briefly across invalid reads, and cancel a gesture explicitly after a bounded fault window rather than emitting a normal tap release.","confidence":"code_proven"},{"id":"PLAT-009","severity":"P2","title":"Transient boot probe failure disables base touch or IMU until reboot","impact":"s_touch_ok/s_imu_ok remain false; normal reads return absent without retry. Touch may be unusable for the whole boot, and walking/wrist wake/raw recording remain unavailable. Optional external hot-plug support is separately a missing feature, not assumed to be promised.","recommendation":"Use bounded backoff reprobe/reconfiguration for essential base devices, expose a retry control and first/last error, and avoid spinning/log flooding on genuine absence.","confidence":"code_proven"},{"id":"PLAT-010","severity":"P2","title":"RTC synchronization request is discarded before the write succeeds","impact":"board_task clears s_rtc_dirty before invoking a void rtc_save. Failure is not requeued, so battery-backed RTC may retain old time or invalid state until another sync or explicit sleep attempt. Early control-read/stop failures return without the RTC warning or validity update.","recommendation":"Return write status, retain the pending request until success with bounded retry, use current trusted UTC when retrying, and log the failed register operation and retry/recovery event.","confidence":"code_proven"},{"id":"PLAT-011","severity":"P2","title":"Wi-Fi scan selection loses long network names","impact":"The scan model stores only 23 visible bytes and that truncated value becomes the actual connect target. Scan selection cannot join the full-name network; Other network/phone setup can provide all 32 bytes.","recommendation":"Store the complete 32-byte SSID plus terminator in the HAL snapshot, preserve exact bytes for connection, and truncate only the drawn label.","confidence":"code_proven"},{"id":"PLAT-012","severity":"P2","title":"Bluetooth off preference changes the tile without disabling the radio","impact":"The saved/tile state changes, but NimBLE still starts and remains connectable. The control therefore cannot deliver the battery or availability behavior implied by off. Current source intentionally keeps the phone link alive, which should be represented honestly in the UI.","recommendation":"Implement explicit BLE enable/disable ownership and restart behavior, or replace the off toggle with a truthful supported phone-link action.","confidence":"code_proven"},{"id":"PLAT-013","severity":"P2","title":"Synchronous SD work shares tasks with motion and optional sensor servicing","impact":"Base walking/knock/cached wake and power sampling pause behind board-task SD work. All slow strap services pause behind audio_service, risking GPS UART loss and HR FIFO overflow. The separate raw IMU sampler/writer separation protects its own stream from SD, but does not protect the board cached-motion pipeline. Delay frequency and magnitude have not been measured here.","recommendation":"Move filesystem operations to a dedicated bounded worker, retain mount leases/SD locking, and add loop-gap/max-I/O-duration/FIFO-overrun/serial-loss counters before drawing causal conclusions.","confidence":"strong_inference"},{"id":"PLAT-014","severity":"P2","title":"Display DMA waits have no bounded fault or recovery path","impact":"Raw/rotated credit waits and the UI frame fence can block indefinitely, freezing UI commands, preference pumping and the UI-owned service loop. Other FreeRTOS tasks may continue. This is a recovery gap, not a claim that it caused a historical hang.","recommendation":"Add bounded progress monitoring and a deferred diagnostic snapshot containing queue/credit/job state; recover through an owned display reinitialization or controlled restart after preserving settings. Never return buffer ownership while DMA might still be active.","confidence":"code_proven"},{"id":"PLAT-015","severity":"P2","title":"Panel command failures are ignored after host state is advanced","impact":"Software assumes the state change succeeded and may suppress future commands as redundant. A failed brightness or wake command can leave the physical panel out of sync with power/theme state, without a retained operation error or retry. Bitmap submission uses ESP_ERROR_CHECK, so error policy is inconsistent.","recommendation":"Record each panel command result and actual acknowledgment, update applied state only on success, and add bounded retry/recovery with last failed operation/register.","confidence":"code_proven"},{"id":"PLAT-016","severity":"P2","title":"Air analyzer reports success if its lease/hop timer fails","impact":"The station link is already parked and promiscuous mode enabled, but the function still marks the analyzer on and returns success. Without timer callbacks it cannot hop channels or enforce the 3-second auto-release contract; station reconnection requires a separate stop path.","recommendation":"Check timer creation/start, undo promiscuous mode and restore station intent on every failed entry, and keep an independent supervisor for lease expiry.","confidence":"code_proven"},{"id":"PLAT-020","severity":"P2","title":"GPS can invalidate a newly parsed fix using the older service-loop timestamp","impact":"sentence records a newer last_fix timestamp, but the post-pump stale check subtracts it from the older unsigned now. The elapsed value wraps and the same pass clears the newly valid fix. Physical frequency depends on task/I/O timing and has not been measured.","recommendation":"Refresh the monotonic timestamp after pump before stale checks, and use a wrap-safe elapsed helper that treats newer acquisition timestamps as fresh. Apply the same rule to lease and data timestamps across services.","confidence":"code_proven"},{"id":"PROTO-001","severity":"P2","title":"Notification text can be mistaken for a clock or timezone command","impact":"The frame parser recognizes both the notification JSON and the text inside it as a clock command. svc applies the clock/timezone before posting the notification, potentially shifting alarms, dates and logs.","recommendation":"Parse top-level command framing lexically and ignore command-like strings inside JSON/quoted text. Add round-trip tests using benign notification examples and multiple framed commands.","confidence":"code_proven"},{"id":"STOR-005","severity":"P2","title":"Storage read failures are reported as missing files","impact":"SDGET/SDGET2/SDCRC return MISSING; host raises FileNotFoundError and deliberately avoids retry. Operators cannot tell absence from the failure mode that blocked the previous flash.","recommendation":"Reserve MISSING for ENOENT; return a typed operation/error/errno response for other failures. Keep retries bounded and read-only; include SD generation and resource telemetry in failure reports.","confidence":"code_proven"},{"id":"STOR-007","severity":"P2","title":"Retried journal records can bias on-watch battery-history averages","impact":"Intake records are deduplicated, but battery samples are counted twice, giving repeated samples extra weight and overstating sample counts. Offline exporters and on-watch summaries can disagree.","recommendation":"Deduplicate all journal records by durable identity before aggregation, or commit batches with durable replay-safe boundaries. Carry last-seen identity per stream where append ordering permits a bounded implementation.","confidence":"strong_inference"},{"id":"TEST-001","severity":"P2","title":"An SD lease regression test no longer compiles against the active transfer dispatcher","impact":"The intended mount/lease safety check does not exercise production code, leaving a storage regression blind spot despite other transfer tests passing.","recommendation":"Update the mock to include paced downloads and cover each early return/lease balance; run it in a single documented host validation command/CI gate.","confidence":"observed"},{"id":"APP-018","severity":"P3","title":"An accepted BMP280 is shown as measuring zero percent humidity","impact":"The driver synthesizes humidity=0 for a chip without humidity sensing. The app presents a measured HUMIDITY 0% and an empty gauge instead of unavailable.","recommendation":"Add a humidity-valid/capability field to hal_env and show unavailable for BMP280 while retaining pressure and temperature support.","confidence":"code_proven"},{"id":"APP-019","severity":"P3","title":"Revealing Torch after an alert resets red/dim mode to full white","impact":"Torch's reveal enter is treated as a fresh visit, resetting mode to white and level to 100%. Its next tick requests full backlight, losing the user's chosen light on an ordinary interruption.","recommendation":"Preserve Torch's mode and per-mode level across covers/reveals, initialize defaults only on a new opening, and reapply the preserved override after the covering screen restores brightness.","confidence":"code_proven"},{"id":"APP-020","severity":"P3","title":"Critical time/connection actions lack result and transition diagnostics","impact":"Generic navigation records identify screen entry but not event generation, action request, backend completion, stale age, rejected point reason, or persistence outcome. Track/Recorder emit a coarse SP_ROUTINE value; LTE/audio expose aggregate debug counters, making a specific failure difficult to reconstruct.","recommendation":"Add bounded transition-only diagnostic events with request/session generation, old/new state, source, age/reason, and completion status. Rate-limit aggregate rejected-fix counters; keep message bodies/caller content out of routine logs.","confidence":"code_proven"},{"id":"DEV-014","severity":"P3","title":"Private worktree and temporary-output policy is not encoded in repository tooling","impact":".gitignore covers build/dist/firmware outputs but not .worktrees; git check-ignore returns no match for .worktrees/_audit_tmp/check.tmp. Build verification uses the ambient TEMP directory and fixed child name, and simulator named binaries share objects. An isolated audit/dev checkout can pollute status or place heavy temporary files on C:, and concurrent output provenance is unclear. This audit explicitly redirects TEMP/TMP to A: and writes checks separately.","recommendation":"Document and enforce workspace-local .worktrees plus A:-resident TEMP/TMP for heavy runs; ignore that private root, validate resolved output/delete targets and use GUID run directories or cache locks with manifests. Add disk-space/output-root preflight to heavy jobs.","confidence":"code_proven"},{"id":"DEV-016","severity":"P3","title":"Connectivity hardware QA opens COM3 and performs mutations at module import","impact":"The module opens a hardcoded serial port at top level, then changes watch UI/preferences, joins a Windows WLAN profile and invokes HardReset during cleanup, even when an earlier assertion fails after original preferences were read. There is no CLI --port/identity/dry-run boundary or __main__ guard. Existing restoration logic is useful but cannot make import read-only or verify that COM3 is the intended watch.","recommendation":"Move execution into main(), require an explicit port and target identity, separate offline helpers from device scenarios, and describe the exact mutations/reset in --help. Keep restoration in a robust finally block and retain proof of the prior/current configuration.","confidence":"code_proven"},{"id":"ENG-004","severity":"P3","title":"Generic action/navigation records cannot reconstruct selected UI targets or action completion","impact":"Logs can identify a screen and input event, but cannot establish which card/tile/row/face was intended, which ID was acted on, or whether navigation completed/cancelled. This particularly obstructs diagnosing ENG-001. Screen-name hash decoding does exist in tools/diag_export.py, so the gap is payload semantics, not a missing decoder.","recommendation":"Emit sparse semantic records at action commit/completion with stable target ID and result, plus source/destination/transition outcome for navigation. Keep high-rate raw touch streams separate from these finite domain events.","confidence":"code_proven"},{"id":"ENG-005","severity":"P3","title":"Engine timing and ink-damage API comments describe superseded behavior","impact":"The header promises whole-period quantization and says ink dim is absent from damage hashes, whereas current implementation uses bounded exact elapsed dt and hashes dim. Implementers can introduce unnecessary manual markers or make incorrect timing assumptions.","recommendation":"Update nos.h to the exact bounded elapsed-time contract, distinguish authored frame sampling from engine dt, and document current dim tracking/callback requirements. Keep API documentation aligned with the current regression tests.","confidence":"code_proven"},{"id":"FACE-008","severity":"P3","title":"Line-up event highlight circles Mercury even when Mercury is not a member","impact":"Line-up spokes correctly use the membership mask, but the final highlight ring uses zero-initialized a=0 (Mercury), producing a false planet emphasis.","recommendation":"Skip the single-planet ring for EV_LINEUP or deliberately highlight members from its mask.","confidence":"code_proven"},{"id":"FACE-010","severity":"P3","title":"Simulator ringplate A/B selector changes a cache key but has no rendering effect","impact":"Both commands select the same final dock; a reviewer can mistake successful command acceptance/rebuild for a meaningful A/B visual test.","recommendation":"Remove or explicitly reject the obsolete selector, or implement/report the intended alternatives if they remain useful.","confidence":"code_proven"},{"id":"FACE-011","severity":"P3","title":"Shared date fades retain a30-Hz timebase under the configured40-Hz cadence","impact":"The stated five-frame fade takes about seven40-Hz updates and repeats some perceptual levels instead of one level per nominal frame. The shared blink also retains30-fps phase constants, so its documented500ms hold is375ms at40Hz.","recommendation":"Use the configured cadence consistently for counted fades; express intended real-time blink milestones through named duration conversions if500ms is the product requirement.","confidence":"code_proven"},{"id":"HEALTH-012","severity":"P3","title":"Frozen wrist-placement provenance is only a volatile UI flag","impact":"Persisted wrist/gesture references survive, but placement_source resets to USER after reboot or can remain CALIBRATED after an unrelated manual wrist change. Later workout metadata can misstate how the chosen wrist was established.","recommendation":"Persist explicit wrist-selection source and calibration version with the selected wrist, or conservatively tag all subsequent manually selected sessions USER. Invalidate provenance consistently through a shared preference setter.","confidence":"code_proven"},{"id":"HEALTH-013","severity":"P3","title":"Live IMU graph advertises a fixed4.3-second window without timestamped sampling","impact":"At the nominal20Hz cap the ring holds about3.2seconds, while a30FPS UI commonly accepts a sample every66.7ms, about4.27seconds. Scheduling load can lengthen the span further; the fixed4.3S diagnostic label cannot establish a measured time axis.","recommendation":"Store sample timestamps and label the actual visible duration, or drive the live chart from a declared fixed-rate producer. Keep raw recorder rate/loss metadata separate from this filtered live preview.","confidence":"code_proven"},{"id":"HEALTH-014","severity":"P3","title":"Workout quality rejection and writer failures lack retained causal detail","impact":"Coverage totals and coarse GPS state show that data is missing, but not which age, quality, saturation, discontinuity or I/O condition caused it. A single storage.errors count cannot distinguish open/read/write/fsync/readback/worker failures. Separate sports raw logs may be absent or share the failed SD path, as root OBS-003 documents.","recommendation":"Add bounded per-session rejection counters, latest failure time/reason and accepted acquisition times. Capture storage operation/slot/errno and worker resource failure separately; persist summaries when storage recovers without flooding sample logs.","confidence":"code_proven"},{"id":"PLAT-019","severity":"P3","title":"Legacy contracts and diagnostic labels misdescribe current hardware and storage behavior","impact":"NVS-only storage comments, retired serial OTA instructions, a hardcoded board audio=0, and an ext display_mode cache that the strong NOS override never updates obscure the current implementation. They can mislead debugging and future changes; this is documentation/observability debt, not evidence that the physical hardware is absent or a save failed.","recommendation":"Update comments/help to the active source of truth; expose supported base/strap capabilities and current applied display/radio state in one versioned snapshot. Mark dormant entrypoints and legacy code clearly.","confidence":"code_proven"}],"logging_plan":[{"title":"Common event envelope","priority":"P1","detail":"Versioned bounded binary records: monotonic timestamp, optional UTC plus validity, boot/reset ID, sequence, build/ELF/source IDs, subsystem, severity, event ID, action/session/request ID, state before/after, result/error, duration and explicit evidence-loss counters. Keep human formatting and symbol resolution on the host."},{"title":"Crash and allocation first-fault channel","priority":"P1","detail":"Keep panic-safe/RTC/internal evidence for reset reason, task/core, fault PC, stack/backtrace or coredump reference, last action/session and allocation request/caps/callsite token with internal/DMA free/largest/minimum. Use safe capture hooks and deferred persistence. Preserve matching ELF and a host symbolizer; do not do file I/O or formatted logging inside unsafe hooks."},{"title":"Storage phase and recovery trace","priority":"P1","detail":"Trace lease acquisition, mount generation, lock wait, operation phase, stable path ID, errno/result, bytes, slot/generation/CRC, queue high-water/drop, dirty age, fsync/readback latency and retry outcome. Log CSV chunk/checkpoint/recovery boundaries, not every IMU sample. Give critical faults a separate reserved budget from regular sensor history."},{"title":"Power ownership and measured evidence","priority":"P1","detail":"Record every power state transition with reason, SOC validity/source, rail sample age, CPU/APB lock owners and held duration, display/brightness, actual radio/strap state, wake source, sleep refusal and recorder/background owners. Summarize periodic residency. A measured current/charge integration run with known battery/USB state is required before claiming consumption or capacity."},{"title":"App actions and sensor truth","priority":"P2","detail":"Begin/result events with stable target IDs for settings changes, alarms/timers, notifications, SMS, memos, workout start/pause/save/recover and sensor calibration. Include sample timestamp/quality/stale reason, source, worn wrist and playing hand/confidence/provenance. Log presentation and acquisition separately to detect stale UI."},{"title":"Frame and asynchronous work spans","priority":"P2","detail":"Use a bounded triggerable frame ring for input-to-present, tick/layout/raster/blur, DMA submit/complete/wait, asset admission/publish/cancel and SD stalls. Capture configuration, moving regions, cache cold/warm, missed floor/deadline and relevant lock/resource owners. Aggregate normal frames; preserve a short pre/post fault window."},{"title":"Retention, export and developer controls","priority":"P2","detail":"Per-module levels with bounded duration, rate limiting/coalescing, queue/drop telemetry and explicit session markers. Export one manifest-linked redacted bundle with logs, settings schema/hash, sensor/profile metadata, trace, crash and matching build artifacts. Default to excluding credentials, phone message text, raw contacts and location; make sensitive data selection explicit."}],"qol_plan":[{"title":"One validation and coverage command","priority":"P1","detail":"Run portable unit tests, simulator scenarios, generated asset checks, partition/heap budgets and source/build identity checks with one machine-readable result. Include the currently broken SD lease fixture and record skips and unavailable hardware separately from passes."},{"title":"Reusable host command transport","priority":"P1","detail":"Shared parser/capabilities, correlated commands, explicit accepted/completed results, typed errors, read-only retry policy, mutation idempotence rules and retained redacted wire traces across watchctl, sdsync, flash checkpoints and benchmark helpers."},{"title":"Fault injection and replay library","priority":"P1","detail":"Script missing/removed/slow card, transient EIO/open/short write/fsync failure, allocation rejection, delayed DMA completion, stale/out-of-order samples, clock jumps and alert cover/reveal. Reuse audit repros as future regressions after fixes; positive repros are not passing product correctness tests."},{"title":"Build/provenance and symbolication bundle","priority":"P1","detail":"Save dirty source fingerprint, config, partition map, compiler/IDF, native asset hash, firmware/ELF hashes, symbolizer inputs and recovery metadata per flashed image. Refuse a stale or wrong-workspace image; retain the current NVS-preserving checkpoint workflow."},{"title":"Sports evaluation rather than heuristic claims","priority":"P2","detail":"Version profile/model/calibration, expose worn wrist separately from playing hand, confidence and unknown state. Replay the confirmed right-handed/left-wrist badminton recordings as one known context. Build a held-out bilateral, non-dominant and mixed-sport matrix for football, cricket, badminton, running and hiking before accuracy claims."},{"title":"Accessible in-watch diagnostic workflow","priority":"P2","detail":"Add last-fault summary, current SD/heap/DMA and sensor freshness, active resource owners, unsaved settings, recording-recovery state, a capture marker, bounded trace toggle and one bundle export. Make destructive actions deliberate and report completion/errors instead of silent UI state changes."},{"title":"Simulator and device contract comparison","priority":"P2","detail":"Mark simulated capabilities and estimated costs. Run the same action/session scripts against simulator and device with explicit expectations for hardware absence, timers, persistence, timezones, asynchronous results and raw-data schemas. Maintain app/screen lifecycle coverage, not just screenshots."}],"apps":[{"name":"Activity","findings":[]},{"name":"Sports","findings":["HEALTH-001"]},{"name":"Energy","findings":["HEALTH-006"]},{"name":"Battery history","findings":["HEALTH-006"]},{"name":"Sensor logs","findings":["HEALTH-006"]},{"name":"Wrist tuning","findings":["HEALTH-006","HEALTH-007"]},{"name":"Quick report","findings":["HEALTH-006"]},{"name":"Heart rate","findings":["HEALTH-002","HEALTH-005"]},{"name":"Breathe","findings":["HEALTH-003","HEALTH-005"]},{"name":"Weather","findings":["APP-014","APP-015","APP-020"]},{"name":"Music","findings":["APP-017","APP-020"]},{"name":"Timer","findings":["APP-016","APP-020"]},{"name":"Stopwatch","findings":[]},{"name":"Alarms","findings":["APP-016","APP-020","APP-021"]},{"name":"World clock","findings":["APP-013"]},{"name":"Compass","findings":["APP-008","APP-009","APP-020"]},{"name":"IMU","findings":["HEALTH-013"]},{"name":"Barometer","findings":["APP-018","APP-020"]},{"name":"Navigate","findings":["APP-001","APP-002","APP-003","APP-004","APP-020"]},{"name":"Cellular","findings":["APP-010","APP-011","APP-012","APP-020","APP-022"]},{"name":"Recorder","findings":["APP-005","APP-006","APP-007","APP-020"]},{"name":"Find phone","findings":["APP-016","APP-020"]},{"name":"Torch","findings":["APP-019"]},{"name":"Developer tools","findings":[]},{"name":"Diagnostics","findings":["DEV-006"]},{"name":"Settings","findings":["DEV-001","DEV-002","DEV-003","DEV-015"]}],"limitations":["This is a targeted, read-only source audit of the current recovered dirty workspace, not a proof of absence of defects. No implementation fixes or new firmware build/flash were performed.","All 26 launcher entries, 70 production screen definitions and 129 compiled production translation units have coverage associations. File/entrypoint coverage does not imply every branch or screen was dynamically exercised.","Generated tables/fonts/art were reviewed as data, indexing, ownership and compatibility contracts, not individually verified literal values. Inactive core/apps and firmware/main/main.c are not the active OS.","ESP-IDF/FreeRTOS/vendor dependencies are reviewed through the project contracts and configuration used here, not as separate exhaustive audits of dependency source trees.","Host tests and injected positive repros validate narrow software behavior. Optional hardware, real phone protocols, unplugged battery endurance, physical sensor accuracy and power-loss/media-removal resilience remain unverified.","A fresh read-only USB diagnostic snapshot has no current allocation/SD log errors. Earlier low-DMA storage failures and two crash boots are separate historical evidence; exact crash causation is not established.","The live preference hash/brightness changed since the prior flash by user interaction (current 6f530340 / 62). The audit did not restore older settings. No device mutation was used for verification.","The branch HEAD predates recovered work; this report uses inventoried current files. No worktree was created or firmware substituted. All new audit/temp artifacts reside on A:.","Priority expresses engineering urgency for this early-stage system. P0 means demonstrated critical emergency (none confirmed); P1 means address before trusting data/update boundaries; P2 means functional/reliability improvement; P3 means lower-impact correctness/documentation/observability debt."]},E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),C=document.querySelector('#content');let tab='priorities',query='',priority='P1';
const c=D.counts;document.querySelector('#stats').innerHTML=[[c.findings,'unique findings'],[c.apps+' / '+c.screens,'apps / screens'],[c.modules,'module reviews'],[c.compiled_sources,'compiled project sources']].map(x=>'<div class="stat"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div>').join('');
document.querySelector('#intro').innerHTML='<span class="badge P1">P1 '+(c.by_severity.P1||0)+'</span><span class="badge P2">P2 '+(c.by_severity.P2||0)+'</span><span class="badge P3">P3 '+(c.by_severity.P3||0)+'</span> <span class="muted">'+(c.by_severity.P0||0)+' confirmed P0</span>';
const nav=[['priorities','Findings'],['apps','App coverage'],['logging','Logging plan'],['qol','Developer QoL'],['limits','Evidence limits']];document.querySelector('nav').innerHTML=nav.map(([id,name])=>'<button data-tab="'+id+'">'+name+'</button>').join('');
function rows(){const f=D.findings.filter(x=>(priority==='all'||x.severity===priority)&&(!query||JSON.stringify(x).toLowerCase().includes(query.toLowerCase())));document.querySelector('#rows').innerHTML='<p class="muted">'+f.length+' matching findings. P1 = address before trusting data and update boundaries.</p>'+f.map(x=>'<details><summary><span class="badge '+E(x.severity)+'">'+E(x.severity)+'</span><span class="id">'+E(x.id)+'</span><strong>'+E(x.title)+'</strong></summary><p>'+E(x.impact)+'</p><p><span class="label">Recommended change</span><br>'+E(x.recommendation)+'</p><p class="muted">Evidence classification: '+E(x.confidence.replaceAll('_',' '))+'. Exact source and verification notes are in the full report.</p></details>').join('')}
function draw(){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='priorities'){C.innerHTML='<p>Storage error handling can lose existing data or recovery state. Image/update boundaries, clock handling and long-session resource evidence need correction.</p><div class="filters"><input id="query" aria-label="Search findings" placeholder="Search findings…"><select id="priority" aria-label="Priority">'+['P1','P2','P3','all'].map(x=>'<option value="'+x+'" '+(priority===x?'selected':'')+'>'+E(x==='all'?'All priorities':x)+'</option>').join('')+'</select></div><div id="rows"></div>';document.querySelector('#query').value=query;document.querySelector('#query').oninput=e=>{query=e.target.value;rows()};document.querySelector('#priority').onchange=e=>{priority=e.target.value;rows()};rows()}else if(tab==='apps'){C.innerHTML='<p>All '+c.apps+' launcher apps have individual reviews. Linked finding IDs may span shared services; they are counted once globally.</p>'+D.apps.map(a=>'<div class="app"><b>'+E(a.name)+'</b><span class="muted">'+E(a.findings.join(' · ')||'No additional confirmed defect in the scoped app review')+'</span></div>').join('')}else if(tab==='logging'||tab==='qol'){C.innerHTML=(tab==='logging'?D.logging_plan:D.qol_plan).map(x=>'<details><summary><span class="badge '+x.priority+'">'+x.priority+'</span><strong>'+E(x.title)+'</strong></summary><p>'+E(x.detail)+'</p></details>').join('')}else{C.innerHTML='<div class="box"><h3>Fresh snapshot versus historical failures</h3><p>The read-only USB snapshot showed no allocation or SD log errors. Earlier prolonged-runtime DMA failures and reported crashes remain separate evidence. USB power made qualified SOC invalid; battery endurance is unverified.</p><p>Previous target scroll captures: Apps p95 38 ms and Settings p95 42 ms. Both exceed the 33.33 ms interval required by the 30 FPS floor.</p></div><ul>'+D.limitations.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>'}}
document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;draw()});draw();console.log('audit-overview-ready',JSON.stringify(c));
