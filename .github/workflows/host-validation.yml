name: NOS host validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
      - name: Install host Python dependencies
        run: python -m pip install -r tools/requirements-host.txt
      - name: Portable host gate
        run: python tools/validate.py --profile host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-host-results
          path: build/validation/
  nos-offline:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
      - uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: '12.2.0'
      - name: Install host Python dependencies
        run: python -m pip install -r tools/requirements-host.txt
      - name: Build strict current NOS and compare cost hooks
        shell: pwsh
        run: ./sim/nos_build.ps1 -Strict -Verify
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: .worktrees/_audit_tmp/cjson
      - name: Complete offline gate
        shell: pwsh
        run: python tools/validate.py --profile offline --sim build/nos_sim.exe --cjson-dir .worktrees/_audit_tmp/cjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nos-offline-results
          path: |
            build/validation/
            .worktrees/_audit_tmp/sim-*/build.json
            .worktrees/_audit_tmp/sim-*/*.log
